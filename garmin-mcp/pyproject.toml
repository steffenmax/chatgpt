[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server that gives Claude (or any MCP client) read access to your Garmin Connect data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "garminconnect>=0.3.20,<0.4",
]

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "anyio>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
